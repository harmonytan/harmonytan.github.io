<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Articles · Hongming's Blog</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles/main.css" />
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["\\(", "\\)"], ["$", "$"]],
        displayMath: [["\\[", "\\]"], ["$$", "$$"]],
      },
      options: {
        skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"],
      },
    };
  </script>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css"
  />
  <script
    defer
    src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/common.min.js"
  ></script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script type="module" src="scripts/header.js" defer></script>
  <script type="module" src="scripts/article.js" defer></script>
</head>

<body>
  <header class="site-header">
    <div class="site-shell">
      <a class="brand" href="index.html">Hongming Tan</a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a class="active" href="articles.html">Articles</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="site-main article-layout">
    <div class="article-grid">
      <div class="article-column">
        <article class="article">
          <div id="article-top" class="article-top-anchor"></div>
          <div class="article-hero-wrap">
            <header class="article-hero simple-hero">
              <p class="article-topic-chip" data-article-topic>Notebook</p>
              <h1 data-article-title>Loading...</h1>
              <time class="article-date" data-article-date>—</time>
            </header>
            <figure class="article-hero-image" data-hero-image style="display: none;">
              <img data-hero-image-img alt="Article cover image" />
            </figure>
          </div>
          <div class="article-body-wrap">
            <div class="article-body" data-article-content>
              <p class="muted">Retrieving markdown content…</p>
            </div>
          </div>
        </article>
        <aside class="article-actions">
          <a class="button ghost" href="articles.html">Back to Articles</a>
        </aside>
      </div>
    </div>
  </main>
</body>

</html>
