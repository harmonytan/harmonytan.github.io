<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Articles · Hongming's Blog</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <script>
    (function () {
      const storageKey = "hm-blog-theme";
      try {
        const stored = localStorage.getItem(storageKey);
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        const theme = stored === "light" || stored === "dark" ? stored : prefersDark ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
      } catch (_error) {
        /* ignore theme init errors */
      }
    })();
  </script>
  <link rel="stylesheet" href="styles/main.css?v=5d47426fa0" />
  <script type="module" src="scripts/header.js?v=149c7b5931" defer></script>
  <script type="module" src="scripts/articles.js?v=742d612010" defer></script>
  </head>
  <body>
  <header class="site-header">
    <div class="site-shell">
      <a class="brand" href="index.html">
        <img class="brand-mark" src="assets/brand-h.svg?v=2" alt="" aria-hidden="true" />
        <span class="brand-text">Hongming Tan</span>
      </a>
      <nav class="site-nav" id="site-navigation">
        <a href="index.html">Home</a>
        <a class="active" href="articles.html">Articles</a>
        <a href="contact.html">Contact</a>
        <div class="mobile-theme-switch" role="group" aria-label="Theme switch">
          <button type="button" class="mobile-theme-option" data-theme-option="light" aria-pressed="false" aria-label="Light theme"></button>
          <button type="button" class="mobile-theme-option" data-theme-option="dark" aria-pressed="false" aria-label="Dark theme"></button>
        </div>
      </nav>
      <div class="header-actions">
        <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false">
          <span class="theme-toggle-icon" aria-hidden="true" data-theme-icon>☀️</span>
        </button>
        <button
          class="menu-toggle"
          type="button"
          data-menu-toggle
          aria-expanded="false"
          aria-controls="site-navigation"
          aria-label="Open navigation menu"
        >
          <span class="menu-toggle-icon" aria-hidden="true"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="site-main">
      <section class="section article-index">
        <div class="article-index-header">
          <h1 class="article-index-title">Articles</h1>
          <div class="article-search-wrap">
            <svg class="article-search-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="2" fill="none"></circle>
              <line x1="16" y1="16" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"></line>
            </svg>
            <input
              type="search"
              class="article-search"
              placeholder="Search"
              aria-label="Search articles"
              data-article-search
            />
          </div>
        </div>
        <div class="article-table" data-article-table>
          <p class="muted">Gathering the index…</p>
        </div>
      </section>
    </main>
  </body>
</html>
