name: Site consistency

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate generated article sources
        run: npm run content:check

      - name: Build static site
        run: npm run build

      - name: Verify the deployment artifact
        run: test -f dist/index.html && test -f dist/articles/recent-myths-in-the-silver-market/index.html
